name: Demo

# Regenerate demo.gif via charmbracelet/vhs.
# - On PR: render and upload as artifact (reviewers can verify, no commit on the branch).
# - On push to master: render and bot-commit demo.gif if it changed.
#
# Triggered only when the tape, the CLI/UI, or this workflow itself changes.

on:
  pull_request:
    paths:
      - demo.tape
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/demo.yml
  push:
    branches: [master]
    paths:
      - demo.tape
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/demo.yml

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install sqlite + vhs runtime deps
        # vhs needs ttyd + ffmpeg. ubuntu-latest ships modern enough versions
        # in apt; we install them explicitly rather than relying on
        # vhs-action's internal installer (which has been flaky for ffmpeg).
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ffmpeg ttyd

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@latest

      - name: Build rapg
        # Build the whole package, not just main.go — cmd/rapg now spans
        # multiple files (main.go, hooks.go, ...).
        run: go build -o rapg ./cmd/rapg

      - name: Render demo
        run: vhs demo.tape

      - name: Upload demo as artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: demo.gif
          retention-days: 14

      - name: Commit regenerated demo.gif (master only)
        if: github.event_name == 'push'
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ -z "$(git status --porcelain demo.gif)" ]]; then
            echo "demo.gif unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add demo.gif
          # [skip ci] avoids a potential loop if a PAT is ever swapped in;
          # the default GITHUB_TOKEN does not retrigger workflows on push.
          git commit -m "chore(demo): auto-regenerate demo.gif [skip ci]"
          git push
