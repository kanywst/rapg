name: Test and Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev

    - name: Build
      run: go build -v ./cmd/rapg/...

    - name: Test
      run: go test -v -race ./...

  # Any go.mod change moves the flake's vendorHash. Without this job a
  # dependency bump merges green and leaves `nix run` broken on master.
  nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v31.11.1

    - name: Build the flake
      run: nix build .#rapg -L

    - name: Check the flake outputs
      run: nix flake check
