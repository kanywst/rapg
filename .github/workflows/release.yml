name: Release

# Build and publish cross-platform binaries on tag push.
#
# rapg links go-sqlite3, so CGO is required and plain cross-compilation from a
# single host fails (the host C toolchain can't target other OSes). We run
# GoReleaser inside the goreleaser-cross image, which bundles the C
# cross-toolchains (incl. osxcross) for linux / windows / darwin.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless cosign signing trades this OIDC token for a short-lived Fulcio
  # certificate. Without it, the `signs` block in .goreleaser.yaml fails.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so GoReleaser can build the changelog and
          # validate the tag.
          fetch-depth: 0

      # The goreleaser-cross image carries the C cross-toolchains but neither
      # syft nor cosign, so install both on the runner and mount them into the
      # container below. Both are static Go binaries, so they run fine there.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      # Pinned: cosign v3 replaced the v2 --output-certificate/--output-signature
      # flags with a single --bundle, so the `signs` block in .goreleaser.yaml is
      # major-version specific. Let this float and a cosign v4 would break the
      # release silently at tag time.
      #
      # The installer has to be v4: cosign v3 releases dropped the detached
      # `cosign-linux-amd64.sig` in favour of a `.sigstore.json` bundle, and
      # installer v3 still curls the `.sig` to verify the download, so it 404s
      # on any cosign v3 tag.
      - name: Install cosign (artifact signing)
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: 'v3.1.3'

      - name: Run GoReleaser (cross, CGO)
        # GITHUB_TOKEN publishes the release on this repo. TAP_GITHUB_TOKEN is a
        # PAT with write access to kanywst/homebrew-tap (a cross-repo push the
        # default GITHUB_TOKEN can't do); set it as a repo secret. The
        # ACTIONS_ID_TOKEN_REQUEST_* pair is what cosign uses to fetch the OIDC
        # token for keyless signing; the runner only sets it when the job has
        # id-token: write. The safe.directory line avoids git's "dubious
        # ownership" error when the container root user reads the runner-owned
        # checkout.
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e TAP_GITHUB_TOKEN="${{ secrets.TAP_GITHUB_TOKEN }}" \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "$(command -v syft)":/usr/local/bin/syft:ro \
            -v "$(command -v cosign)":/usr/local/bin/cosign:ro \
            -v "$PWD":/go/src/github.com/kanywst/rapg \
            -w /go/src/github.com/kanywst/rapg \
            --entrypoint /bin/bash \
            goreleaser/goreleaser-cross:v1.26.3 \
            -c "git config --global --add safe.directory /go/src/github.com/kanywst/rapg && goreleaser release --clean"
