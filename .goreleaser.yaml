# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=1
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # mingw arm64 CGO support is fragile; skip this niche target.
      - goos: windows
        goarch: arm64
    main: ./cmd/rapg
    ldflags:
      - -s -w -X github.com/kanywst/rapg/internal/version.Version={{ .Version }}
    # CGO needs a per-target C cross-compiler. These names are the ones the
    # goreleaser-cross image provides; without them CGO falls back to the host
    # gcc and fails to assemble other architectures.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: windows
        goarch: amd64
        env:
          - CC=x86_64-w64-mingw32-gcc
          - CXX=x86_64-w64-mingw32-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# `brews` (Homebrew Formulas) is deprecated: soft in goreleaser v2.10, hard in
# v2.16, which is the version the release image already ships. Casks are what
# goreleaser generates for pre-compiled binaries now, and it is the shape the
# rest of kanywst/homebrew-tap already uses.
homebrew_casks:
  - name: rapg

    # Which binaries from the archive to link into the Homebrew prefix. This
    # replaces the old `install: bin.install "rapg"` script.
    binaries:
      - rapg

    # Casks are downloaded with curl, so macOS tags the payload with the
    # com.apple.quarantine attribute and Gatekeeper refuses to run it. Stripping
    # it in postflight is the migration path goreleaser documents.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rapg"]
          end

    # Repository to push the cask to. TAP_GITHUB_TOKEN is a PAT with write
    # access to kanywst/homebrew-tap; see the release workflow.
    repository:
      owner: kanywst
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    url:
      template: "https://github.com/kanywst/rapg/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com

    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

    # Folder inside the tap repository to put the cask in.
    directory: Casks

    homepage: "https://github.com/kanywst/rapg"
    # Homebrew's audit rules want no leading article, no trailing period, and no
    # repetition of the cask name.
    description: "Local-first secret manager for the AI-agent era"

    # `auto` keeps prereleases out of the tap; tagged releases still publish.
    skip_upload: auto
